name: Template checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r assets/template/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: |
          c++ -std=c++17 assets/template/tests/magic_state_test.cpp -o /tmp/magic-state-test
          /tmp/magic-state-test
          c++ -std=c++17 assets/template/tests/magic_water_test.cpp -o /tmp/magic-water-test
          /tmp/magic-water-test
